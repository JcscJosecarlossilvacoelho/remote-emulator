name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent "dist/Remote Emulator.app" dist/Remote-Emulator.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Remote-Emulator.zip \
            --title "Remote Emulator $GITHUB_REF_NAME" \
            --generate-notes
